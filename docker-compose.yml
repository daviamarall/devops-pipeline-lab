services:
  api:
    build: .
    image: devops-pipeline-lab:local
    container_name: devops-pipeline-lab
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "local"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
